<text x="212" y="163" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700" fill="#17365D">收集問題／知識需求</text>
<text x="212" y="196" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="16" fill="#334E68">ROLE-COORD · Form-Q</text>
