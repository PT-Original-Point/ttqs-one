<text x="448" y="529" font-family="Microsoft JhengHei,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">W6</text>
<text x="607" y="578" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700" fill="#17365D">檢查結果證據</text>
<text x="607" y="611" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="16" fill="#334E68">ROLE-AUDIT · OUT1–OUT9</text>
<line x1="444" y1="632" x2="771" y2="632" stroke="#C5D1DC" stroke-width="2"/>
<text x="607" y="657" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="15" fill="#8B2C2C">把觀察宣稱為學習因果成效 → REJECT</text>
<rect x="35" y="500" width="355" height="210" rx="18" fill="#F4F7FB" stroke="#5B7894" stroke-width="3"/>
<rect x="35" y="500" width="355" height="42" rx="18" fill="#17365D"/>
<text x="53" y="529" font-family="Microsoft JhengHei,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">W7</text>
<text x="212" y="578" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700" fill="#17365D">排程與後續行動追蹤</text>
<text x="212" y="611" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="16" fill="#334E68">ROLE-FACIL · Form-F</text>
<line x1="49" y1="632" x2="376" y2="632" stroke="#C5D1DC" stroke-width="2"/>
<text x="212" y="657" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="15" fill="#8B2C2C">追蹤責任、期限與未決事項</text>
<text x="810" y="805" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="15" fill="#5B6573">所有節點均屬 SAMPLE / SYNTHETIC 流程示範；實際活動須另附 REAL 原始紀錄。</text>
