<rect x="825" y="85" width="355" height="210" rx="18" fill="#F4F7FB" stroke="#5B7894" stroke-width="3"/>
<rect x="825" y="85" width="355" height="42" rx="18" fill="#17365D"/>
<text x="843" y="114" font-family="Microsoft JhengHei,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">W3</text>
