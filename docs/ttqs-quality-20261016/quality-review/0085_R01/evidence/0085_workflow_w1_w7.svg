<text x="448" y="114" font-family="Microsoft JhengHei,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">W2</text>
<text x="607" y="163" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700" fill="#17365D">選題與框架設計</text>
<text x="607" y="196" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="16" fill="#334E68">ROLE-FACIL · Form-T</text>
