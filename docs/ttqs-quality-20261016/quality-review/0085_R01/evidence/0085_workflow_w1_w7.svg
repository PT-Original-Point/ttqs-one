<text x="1002" y="578" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700" fill="#17365D">實務應用嘗試記錄</text>
<text x="1002" y="611" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="16" fill="#334E68">ROLE-COORD / ROLE-MEMBER · Form-A</text>
<line x1="839" y1="632" x2="1166" y2="632" stroke="#C5D1DC" stroke-width="2"/>
<text x="1002" y="657" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="15" fill="#8B2C2C">以自述代替實際套用證據 → RETURN</text>
