name: R7 Diagnostic Receipt

on:
  push:
    branches:
      - r7/official129-evaluator-integration-20260821

permissions:
  contents: write

concurrency:
  group: r7-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        id: install
        shell: bash
        run: |
          set +e
          npm ci > /tmp/install.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/install.log
          exit 0
      - name: Run deterministic diagnostic gates
        id: gates
        shell: bash
        run: |
          set +e
          : > /tmp/r7-diagnostic.txt
          echo "head_sha=${GITHUB_SHA}" >> /tmp/r7-diagnostic.txt
          echo "install_code=${{ steps.install.outputs.code }}" >> /tmp/r7-diagnostic.txt
          node scripts/generate-manifest.mjs > /tmp/manifest.log 2>&1
          m=$?
          echo "manifest_code=$m" >> /tmp/r7-diagnostic.txt
          npm run verify > /tmp/verify.log 2>&1
          v=$?
          echo "verify_code=$v" >> /tmp/r7-diagnostic.txt
          node scripts/build-external-official129.mjs > /tmp/build.log 2>&1
          b=$?
          echo "build_code=$b" >> /tmp/r7-diagnostic.txt
          echo "--- MANIFEST TAIL ---" >> /tmp/r7-diagnostic.txt
          tail -n 80 /tmp/manifest.log >> /tmp/r7-diagnostic.txt
          echo "--- VERIFY TAIL ---" >> /tmp/r7-diagnostic.txt
          tail -n 200 /tmp/verify.log >> /tmp/r7-diagnostic.txt
          echo "--- BUILD TAIL ---" >> /tmp/r7-diagnostic.txt
          tail -n 100 /tmp/build.log >> /tmp/r7-diagnostic.txt
          mkdir -p release/official129
          cp /tmp/r7-diagnostic.txt release/official129/R7_DIAGNOSTIC.txt
          cat release/official129/R7_DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/official129/R7_DIAGNOSTIC.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R7: capture diagnostic receipt [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
