name: R7 Finalize Feature Branch

on:
  push:
    branches:
      - r7/official129-evaluator-integration-20260821

permissions:
  contents: write

concurrency:
  group: r7-branch-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Freeze original R3 evaluator base before materialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/official129
          if [ ! -f release/official129/R3BaseCode.gs ]; then
            if grep -Fq 'build-time injected R7 frozen projection' external-viewer/Code.gs; then
              echo 'R7_BASE_BACKUP_MISSING_AFTER_MATERIALIZATION' >&2
              exit 2
            fi
            cp external-viewer/Code.gs release/official129/R3BaseCode.gs
          fi
      - name: Install final base-aware deterministic builder
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/build-external-official129.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';

          const root=process.cwd();
          const srcDir=path.join(root,'external-viewer');
          const r7Dir=path.join(root,'release','official129');
          const outDir=path.join(root,'.external-viewer-build');
          const basePath=path.join(r7Dir,'R3BaseCode.gs');
          const expectedProjectionSha='7567530e1f72ef5c8ec491aa38936bf7884ef258943df5f01e0fce08c0c3f2de';
          const expectedRelease='ER-DEMO-20260901-DRAFT-002';

          function fail(code,detail=''){throw new Error(detail?`${code}:${detail}`:code);}
          function sha256(buf){return crypto.createHash('sha256').update(buf).digest('hex');}
          function readUtf8(p){return fs.readFileSync(p,'utf8');}

          const pushFiles=fs.readdirSync(srcDir).sort();
          if(JSON.stringify(pushFiles)!==JSON.stringify(['Code.gs','appsscript.json']))fail('EXTERNAL_PUSH_SET_INVALID',pushFiles.join(','));
          const parts=fs.readdirSync(r7Dir).filter(x=>/^data\.part\d+(?:[a-z])?\.b64$/.test(x)).sort();
          if(parts.length<2)fail('R7_DATA_PARTS_MISSING');
          const b64=parts.map(f=>readUtf8(path.join(r7Dir,f)).trim()).join('');
          if(!/^[A-Za-z0-9+/=]+$/.test(b64))fail('R7_DATA_B64_INVALID');
          let raw;
          try{raw=zlib.gunzipSync(Buffer.from(b64,'base64'));}catch(e){fail('R7_DATA_GZIP_INVALID',e.message);}
          const projectionSha=sha256(raw);
          if(projectionSha!==expectedProjectionSha)fail('R7_PROJECTION_HASH_MISMATCH',projectionSha);
          let data;
          try{data=JSON.parse(raw.toString('utf8'));}catch(e){fail('R7_PROJECTION_JSON_INVALID',e.message);}
          if(data.releaseId!==expectedRelease)fail('R7_RELEASE_ID_MISMATCH',String(data.releaseId));
          if(!Array.isArray(data.items)||data.items.length!==129)fail('R7_ITEM_COUNT_MISMATCH',String(data.items?.length));
          for(const key of ['artifactCode','officialRefId']){
            const vals=data.items.map(x=>String(x[key]||''));
            if(vals.some(x=>!x)||new Set(vals).size!==129)fail('R7_IDENTITY_UNIQUENESS_FAIL',key);
          }
          for(let i=1;i<=19;i++){
            const n=data.items.filter(x=>String(x.indicator).match(/^\d+/)?.[0]===String(i)).length;
            if(n<1)fail('R7_INDICATOR_EMPTY',String(i));
          }
          const runtime=readUtf8(path.join(r7Dir,'Official129Runtime.gs'));
          const legacy=readUtf8(path.join(r7Dir,'Official129LegacyRegression.gs'));
          const runtimeAll=runtime+'\n'+legacy;
          for(const forbidden of [/Sheets\./,/SpreadsheetApp/,/DriveApp/,/UrlFetchApp/])if(forbidden.test(runtimeAll))fail('R7_RUNTIME_GOOGLE_DATA_API_FORBIDDEN',String(forbidden));
          if(!fs.existsSync(basePath))fail('R7_BASE_CODE_MISSING');
          const base=readUtf8(basePath);
          if(base.includes('build-time injected R7 frozen projection'))fail('R7_BASE_CODE_ALREADY_INJECTED');
          if(!base.includes('FA-DEMO-002'))fail('R7_BASE_R3_CONTROL_ROUTE_MISSING');
          const manifest=readUtf8(path.join(srcDir,'appsscript.json'));
          const code=base+'\n\n/* build-time injected R7 frozen projection; source sha256='+expectedProjectionSha+' */\nvar TTQS_R7_DATA_GZIP_B64_='+JSON.stringify(b64)+';\n'+runtimeAll+'\n';
          fs.rmSync(outDir,{recursive:true,force:true});
          fs.mkdirSync(outDir,{recursive:true});
          fs.writeFileSync(path.join(outDir,'Code.gs'),code);
          fs.writeFileSync(path.join(outDir,'appsscript.json'),manifest);
          const buildSha=sha256(Buffer.from(code,'utf8'));
          process.stdout.write(`R7_EXTERNAL_BUILD_PASS items=129 parts=${parts.length} projectionSha256=${expectedProjectionSha} buildCodeSha256=${buildSha} buildBytes=${Buffer.byteLength(code)}\n`);
          EOF
          cat > scripts/materialize-external-official129.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const root=process.cwd();
          const r7Dir=path.join(root,'release','official129');
          const sourceDir=path.join(root,'external-viewer');
          const basePath=path.join(r7Dir,'R3BaseCode.gs');
          const currentPath=path.join(sourceDir,'Code.gs');
          if(!fs.existsSync(basePath))throw new Error('R7_BASE_CODE_MISSING');
          execFileSync(process.execPath,['scripts/build-external-official129.mjs'],{cwd:root,stdio:'inherit'});
          const built=path.join(root,'.external-viewer-build','Code.gs');
          if(!fs.existsSync(built))throw new Error('R7_BUILT_CODE_MISSING');
          fs.copyFileSync(built,currentPath);
          process.stdout.write(`R7_EXTERNAL_MATERIALIZE_PASS target=${path.relative(root,currentPath)} bytes=${fs.statSync(currentPath).size}\n`);
          EOF
      - name: Materialize exactly what the existing TEST deployment workflow will push
        run: node scripts/materialize-external-official129.mjs
      - name: Remove temporary branch diagnostics and self-finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r7-branch-materialize.yml .github/workflows/r7-diagnostic.yml .github/workflows/r7-diagnostic-v2.yml .github/workflows/r7-cleanup-diagnostics.yml .github/workflows/r7-finalize-branch.yml
          rm -f release/official129/R7_DIAGNOSTIC.txt release/official129/R7_DIAG_PASS_ALL release/official129/R7_DIAG_FAIL_*
      - name: Rebuild manifest from the exact final tree
        run: node scripts/generate-manifest.mjs
      - name: Run full regression plus additive R7 tests on exact materialized source
        run: npm run verify
      - name: Rebuild and byte-compare materialized Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-external-official129.mjs
          cmp -s external-viewer/Code.gs .external-viewer-build/Code.gs
          test "$(find .external-viewer-build -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "Code.gs appsscript.json "
          ! grep -Eq 'SpreadsheetApp|DriveApp|UrlFetchApp|Sheets\.' external-viewer/Code.gs
          grep -Fq 'ER-DEMO-20260901-DRAFT-002' external-viewer/Code.gs
          grep -Fq '7567530e1f72ef5c8ec491aa38936bf7884ef258943df5f01e0fce08c0c3f2de' external-viewer/Code.gs
      - name: Publish clean final feature-branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'R7_FINAL_TREE_ALREADY_MATERIALIZED'
            exit 0
          fi
          git commit -m 'R7: materialize exact 129-item TEST evaluator source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
