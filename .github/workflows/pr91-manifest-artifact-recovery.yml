name: PR91 Manifest Artifact Recovery
on:
  push:
    branches:
      - tmp/pr91-manifest-recovery-20260829
    paths:
      - .github/workflows/pr91-manifest-artifact-recovery.yml
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: github.repository == 'PT-Original-Point/ttqs-one' && github.ref == 'refs/heads/tmp/pr91-manifest-recovery-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore exact CI golden manifest bytes and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/golden.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9712482550/zip"
          echo "ec3fe2c492dab512e982115d35eacc901a7b4061460766ba5798da02337b63ec  /tmp/golden.zip" | sha256sum -c -
          rm -rf /tmp/golden && mkdir -p /tmp/golden
          unzip -q /tmp/golden.zip -d /tmp/golden
          test -f /tmp/golden/MANIFEST.sha256
          test -f /tmp/golden/MANIFEST.sha256.sha256
          echo "bc1b93b194a6db45a8b46c6350173299ad83cb007d80e96a7bc603412dc8b718  /tmp/golden/MANIFEST.sha256" | sha256sum -c -
          echo "024fb191b97667031b80d0233688c51ed96686965e2c35fa41febd82eab6cdf2  /tmp/golden/MANIFEST.sha256.sha256" | sha256sum -c -
          test "$(git hash-object /tmp/golden/MANIFEST.sha256)" = "b6ed61420137e61040fa2764e6e4cceee67dc3e8"
          test "$(git hash-object /tmp/golden/MANIFEST.sha256.sha256)" = "dd3f62f1844217589f062aae9e176b8d0b30f4aa"
          cp /tmp/golden/MANIFEST.sha256 release/MANIFEST.sha256
          cp /tmp/golden/MANIFEST.sha256.sha256 release/MANIFEST.sha256.sha256
          rm .github/workflows/pr91-manifest-artifact-recovery.yml
          git config user.name 'ttqs-one-recovery-bot'
          git config user.email 'ttqs-one-recovery-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'RECOVERY_NO_CHANGE'; exit 2; }
          git commit -m 'chore(release): recover exact CI golden manifest bytes'
          git push origin HEAD:tmp/pr91-manifest-recovery-20260829
