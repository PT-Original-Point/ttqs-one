name: PR89 R7 Targeted Matrix Regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted-r7-matrix-regression:
    if: github.head_ref == 'work/r7-nav-verifier-repair-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run targeted actual-fixture matrix regression
        run: node --test tests/r7-matrix-item-verifier.test.mjs tests/r7-nav-verifier-repair.test.mjs
