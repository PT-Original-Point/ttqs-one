name: TTQS ONE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved by GitHub runner 2026-08-11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved by GitHub runner 2026-08-11
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show package.json verify chain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          console.log(`package.json scripts.verify = ${pkg.scripts.verify}`);
          console.log('Expanded subcommands:');
          for (const command of pkg.scripts.verify.split(' && ')) {
            console.log(`- ${command}`);
          }
          NODE

      - name: "verify: generated-manifest"
        id: verify_generated_manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:generated-manifest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: "verify: manifest"
        id: verify_manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:manifest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: "verify: deploy-controls"
        id: verify_deploy_controls
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:deploy-controls
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: "verify: lint"
        id: verify_lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: "verify: test"
        id: verify_test
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: "verify: deploy"
        id: verify_deploy
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:deploy
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Verify actual clasp push set
        shell: bash
        run: |
          printf '%s\n' '{"scriptId":"15ImUCpyi1Jsd8yF8Z6wey_7cw793CymWTLxOqwMka3P1CzE5hQun6qiC","rootDir":"apps-script"}' > .clasp.json
          npx --yes @google/clasp@3.3.0 --version
          npx --yes @google/clasp@3.3.0 show-file-status --json > clasp-status.json
          node scripts/verify-clasp-status.mjs clasp-status.json

      - name: Summarize verify exit codes and enforce gate
        if: ${{ always() }}
        shell: bash
        env:
          RC_GENERATED_MANIFEST: ${{ steps.verify_generated_manifest.outputs.exit_code }}
          RC_MANIFEST: ${{ steps.verify_manifest.outputs.exit_code }}
          RC_DEPLOY_CONTROLS: ${{ steps.verify_deploy_controls.outputs.exit_code }}
          RC_LINT: ${{ steps.verify_lint.outputs.exit_code }}
          RC_TEST: ${{ steps.verify_test.outputs.exit_code }}
          RC_DEPLOY: ${{ steps.verify_deploy.outputs.exit_code }}
        run: |
          generated_manifest="${RC_GENERATED_MANIFEST:-NOT_RUN}"
          manifest="${RC_MANIFEST:-NOT_RUN}"
          deploy_controls="${RC_DEPLOY_CONTROLS:-NOT_RUN}"
          lint="${RC_LINT:-NOT_RUN}"
          test_rc="${RC_TEST:-NOT_RUN}"
          deploy="${RC_DEPLOY:-NOT_RUN}"

          {
            echo '## npm verify diagnostics'
            echo
            echo '| Subcommand | Exit code |'
            echo '|---|---:|'
            echo "| \`npm run verify:generated-manifest\` | \`$generated_manifest\` |"
            echo "| \`npm run verify:manifest\` | \`$manifest\` |"
            echo "| \`npm run verify:deploy-controls\` | \`$deploy_controls\` |"
            echo "| \`npm run lint\` | \`$lint\` |"
            echo "| \`npm test\` | \`$test_rc\` |"
            echo "| \`npm run verify:deploy\` | \`$deploy\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          gate=0
          for code in "$generated_manifest" "$manifest" "$deploy_controls" "$lint" "$test_rc" "$deploy"; do
            if [ "$code" != '0' ]; then
              gate=1
            fi
          done
          exit "$gate"
