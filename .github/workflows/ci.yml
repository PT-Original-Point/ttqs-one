name: TTQS ONE CI Q-03 Diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Q-03 target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'e7ba6825a5ab5d12c0cab9f87593d4a9ab59434f'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show package.json verify chain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          console.log(`scripts.verify = ${pkg.scripts.verify}`);
          for (const command of pkg.scripts.verify.split(' && ')) console.log(`- ${command}`);
          NODE

      - name: "verify: generated-manifest"
        id: generated_manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:generated-manifest
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: "verify: manifest"
        id: manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:manifest
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: "verify: deploy-controls"
        id: deploy_controls
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:deploy-controls
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: "verify: lint"
        id: lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: "verify: test"
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: "verify: deploy"
        id: deploy
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:deploy
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify actual clasp push set
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          printf '%s\n' '{"scriptId":"15ImUCpyi1Jsd8yF8Z6wey_7cw793CymWTLxOqwMka3P1CzE5hQun6qiC","rootDir":"apps-script"}' > .clasp.json
          npx --yes @google/clasp@3.3.0 show-file-status --json > clasp-status.json
          node scripts/verify-clasp-status.mjs clasp-status.json

      - name: Summarize verify exit codes
        if: ${{ always() }}
        shell: bash
        env:
          A: ${{ steps.generated_manifest.outputs.exit_code }}
          B: ${{ steps.manifest.outputs.exit_code }}
          C: ${{ steps.deploy_controls.outputs.exit_code }}
          D: ${{ steps.lint.outputs.exit_code }}
          E: ${{ steps.test.outputs.exit_code }}
          F: ${{ steps.deploy.outputs.exit_code }}
        run: |
          {
            echo '## Q-03 exact-target verify diagnostics'
            echo
            echo 'Target: e7ba6825a5ab5d12c0cab9f87593d4a9ab59434f'
            echo
            echo '| Subcommand | Exit code |'
            echo '|---|---:|'
            echo "| npm run verify:generated-manifest | ${A:-NOT_RUN} |"
            echo "| npm run verify:manifest | ${B:-NOT_RUN} |"
            echo "| npm run verify:deploy-controls | ${C:-NOT_RUN} |"
            echo "| npm run lint | ${D:-NOT_RUN} |"
            echo "| npm test | ${E:-NOT_RUN} |"
            echo "| npm run verify:deploy | ${F:-NOT_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "gate: generated-manifest"
        if: ${{ always() && steps.generated_manifest.outputs.exit_code != '0' }}
        run: exit 1
      - name: "gate: manifest"
        if: ${{ always() && steps.manifest.outputs.exit_code != '0' }}
        run: exit 1
      - name: "gate: deploy-controls"
        if: ${{ always() && steps.deploy_controls.outputs.exit_code != '0' }}
        run: exit 1
      - name: "gate: lint"
        if: ${{ always() && steps.lint.outputs.exit_code != '0' }}
        run: exit 1
      - name: "gate: test"
        if: ${{ always() && steps.test.outputs.exit_code != '0' }}
        run: exit 1
      - name: "gate: deploy"
        if: ${{ always() && steps.deploy.outputs.exit_code != '0' }}
        run: exit 1
