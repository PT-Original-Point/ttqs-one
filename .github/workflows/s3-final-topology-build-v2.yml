name: S3 final topology builder v2

on:
  push:
    branches:
      - s3/final-single-scheduler-topology
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: s3/final-single-scheduler-topology

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply deterministic S3 topology patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_ANCHOR_COUNT_INVALID:{path}:{count}:{old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          scheduler = 'apps-script/SchedulerOrchestrator.gs'
          bootstrap = 'apps-script/Bootstrap.gs'
          shadow = 'apps-script/SchedulerShadow.gs'

          replace_once(scheduler,
              "var TTQS_S2_MODE = 'S2_CLOCK_CONSOLIDATED';\n",
              "var TTQS_S2_MODE = 'S2_CLOCK_CONSOLIDATED';\nvar TTQS_S3_MODE = 'S3_SINGLE_SCHEDULER';\n")

          replace_once(scheduler,
              "function ttqsSchedulerRuntimeMode_() {\n  return String(PropertiesService.getScriptProperties().getProperty(TTQS_S2_MODE_PROPERTY) || 'LEGACY_S1');\n}\n\nfunction ttqsS2TaskDefinitions_() {",
              "function ttqsSchedulerRuntimeMode_() {\n  return String(PropertiesService.getScriptProperties().getProperty(TTQS_S2_MODE_PROPERTY) || 'LEGACY_S1');\n}\n\nfunction ttqsSchedulerMasterModeActive_() {\n  var mode = ttqsSchedulerRuntimeMode_();\n  return mode === TTQS_S2_MODE || mode === TTQS_S3_MODE;\n}\n\nfunction ttqsS2TaskDefinitions_() {")

          replace_once(scheduler,
              "    if (ttqsSchedulerRuntimeMode_() !== TTQS_S2_MODE) return { claimed: false, task: definition.name, reason: 'MODE_NOT_S2' };",
              "    if (!ttqsSchedulerMasterModeActive_()) return { claimed: false, task: definition.name, reason: 'MODE_NOT_MASTER' };")

          replace_once(scheduler,
              "function ttqsSchedulerMasterTrigger() {\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() !== TTQS_S2_MODE) throw new Error('S2_RUNTIME_MODE_REQUIRED');\n  var tickId = ttqsStableId_('S2TICK-', Utilities.getUuid(), 24);",
              "function ttqsSchedulerMasterTrigger() {\n  ttqsAssertTestOnly_();\n  var runtimeMode = ttqsSchedulerRuntimeMode_();\n  if (!ttqsSchedulerMasterModeActive_()) throw new Error('SCHEDULER_MASTER_RUNTIME_MODE_REQUIRED:' + runtimeMode);\n  var tickId = ttqsStableId_('S2TICK-', Utilities.getUuid(), 24);")

          replace_once(scheduler,
              "  return { mode: TTQS_S2_MODE, tick_id: tickId, outcomes: outcomes };\n}",
              "  return { mode: runtimeMode, tick_id: tickId, outcomes: outcomes };\n}")

          replace_once(scheduler,
              "function ttqsInstallS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();",
              "function ttqsInstallS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_ACTIVE');\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();")

          replace_once(scheduler,
              "function ttqsRollbackS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  ttqsS2RestoreLegacyS1_('LEGACY_S1');",
              "function ttqsRollbackS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_ACTIVE');\n  ttqsS2RestoreLegacyS1_('LEGACY_S1');")

          p = Path(scheduler)
          text = p.read_text().rstrip()
          if 'function ttqsInstallS3SingleSchedulerTest()' in text:
              raise SystemExit('S3_FUNCTIONS_ALREADY_PRESENT')
          lines = [
              '', '',
              'function ttqsS3FormSubmitTriggers_() {',
              '  return ScriptApp.getProjectTriggers().filter(function(trigger) {',
              "    return trigger.getHandlerFunction() === 'ttqsOnSpreadsheetFormSubmit';",
              '  });',
              '}', '',
              'function ttqsS3RemoveFormSubmitTriggers_() {',
              '  ttqsS3FormSubmitTriggers_().forEach(function(trigger) { ScriptApp.deleteTrigger(trigger); });',
              '}', '',
              'function ttqsAssertS3TriggerContract_() {',
              '  var counts = {};',
              '  var forbidden = ttqsS2LegacyClockHandlers_();',
              '  forbidden[TTQS_S1_SHADOW_HANDLER] = true;',
              '  var masterCount = 0;',
              '  var submitCount = 0;',
              '  ScriptApp.getProjectTriggers().forEach(function(trigger) {',
              '    var handler = trigger.getHandlerFunction();',
              '    counts[handler] = Number(counts[handler] || 0) + 1;',
              "    if (forbidden[handler]) throw new Error('S3_FORBIDDEN_LEGACY_TRIGGER:' + handler);",
              "    if (handler === 'ttqsOnSpreadsheetFormSubmit') submitCount++;",
              '    if (handler === TTQS_S2_MASTER_HANDLER) {',
              '      masterCount++;',
              "      if (trigger.getEventType() !== ScriptApp.EventType.CLOCK || trigger.getTriggerSource() !== ScriptApp.TriggerSource.CLOCK) throw new Error('S3_MASTER_TRIGGER_CONTRACT_INVALID');",
              '      return;',
              '    }',
              "    throw new Error('S3_UNEXPECTED_TRIGGER:' + handler);",
              '  });',
              "  if (masterCount !== 1) throw new Error('S3_MASTER_TRIGGER_COUNT_INVALID:' + masterCount);",
              "  if (submitCount !== 0) throw new Error('S3_FORM_SUBMIT_TRIGGER_COUNT_INVALID:' + submitCount);",
              '  return { counts: counts, mode: TTQS_S3_MODE, master: masterCount, formSubmit: submitCount };',
              '}', '',
              'function ttqsS3RecordTopology_(action, contract) {',
              '  var now = Date.now();',
              '  var summary = {',
              '    action: String(action || ""),',
              '    mode: String(contract && contract.mode || ttqsSchedulerRuntimeMode_()),',
              '    master: Number(contract && contract.master || 0),',
              '    form_submit: Number(contract && contract.formSubmit || 0)',
              '  };',
              '  return ttqsWithScriptLock_(function() {',
              '    return ttqsS2AppendLogObject_({',
              "      record_id: ttqsStableId_('S3TOPO-', Utilities.getUuid(), 24),",
              "      record_type: 'TOPOLOGY',",
              "      tick_id: '', task_run_id: '', task_name: '__TOPOLOGY__', cadence_minutes: '',",
              '      started_at: new Date(now).toISOString(), finished_at: new Date(now).toISOString(),',
              "      status: 'PASS', reason: String(action || ''), duration_ms: 0,",
              '      summary: ttqsS2Bounded_(JSON.stringify(summary), 1000), error: ""',
              '    });',
              '  });',
              '}', '',
              'function ttqsS3RestoreS2Topology_() {',
              '  return ttqsWithScriptLock_(function() {',
              '    ttqsAssertTestOnly_();',
              '    ttqsRemoveS2MasterTrigger_();',
              '    ScriptApp.newTrigger(TTQS_S2_MASTER_HANDLER).timeBased().everyMinutes(TTQS_S2_MASTER_INTERVAL_MINUTES).create();',
              '    ttqsS2RemoveLegacyClockTriggers_();',
              '    ttqsRemoveShadowSchedulerTrigger_();',
              '    ttqsS3RemoveFormSubmitTriggers_();',
              "    ScriptApp.newTrigger('ttqsOnSpreadsheetFormSubmit').forSpreadsheet(ttqsOpenCore_()).onFormSubmit().create();",
              '    PropertiesService.getScriptProperties().setProperty(TTQS_S2_MODE_PROPERTY, TTQS_S2_MODE);',
              '    ttqsEnsureS2LogSheet_();',
              '    return true;',
              '  });',
              '}', '',
              'function ttqsInstallS3SingleSchedulerTest() {',
              '  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);',
              '  ttqsAssertTestOnly_();',
              '  var mode = ttqsSchedulerRuntimeMode_();',
              '  if (mode === TTQS_S3_MODE) {',
              '    var existing = ttqsAssertS3TriggerContract_();',
              "    ttqsS3RecordTopology_('VERIFY_EXISTING', existing);",
              '    return existing;',
              '  }',
              "  if (mode !== TTQS_S2_MODE) throw new Error('S3_S2_RUNTIME_BASELINE_REQUIRED:' + mode);",
              '  var before = ttqsAssertS2TriggerContract_();',
              '  try {',
              '    ttqsWithScriptLock_(function() {',
              '      ttqsS3RemoveFormSubmitTriggers_();',
              '      PropertiesService.getScriptProperties().setProperty(TTQS_S2_MODE_PROPERTY, TTQS_S3_MODE);',
              '    });',
              '    var after = ttqsAssertS3TriggerContract_();',
              "    ttqsS3RecordTopology_('CUTOVER', after);",
              '    return { mode: TTQS_S3_MODE, environment: "TEST", before: before, after: after, state_revision: ttqsS2LoadState_().revision, form_submit_removed: true, rollback_mode: TTQS_S2_MODE };',
              '  } catch (err) {',
              '    try { ttqsS3RestoreS2Topology_(); ttqsAssertS2TriggerContract_(); }',
              "    catch (rollbackErr) { throw new Error('S3_INSTALL_FAIL:' + ttqsS2Bounded_(err && err.message ? err.message : err, 400) + '|ROLLBACK_FAIL:' + ttqsS2Bounded_(rollbackErr && rollbackErr.message ? rollbackErr.message : rollbackErr, 400)); }",
              '    throw err;',
              '  }',
              '}', '',
              'function ttqsRollbackS3SingleSchedulerTest() {',
              '  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);',
              '  ttqsAssertTestOnly_();',
              '  var mode = ttqsSchedulerRuntimeMode_();',
              '  if (mode === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();',
              "  if (mode !== TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_REQUIRED_FOR_ROLLBACK:' + mode);",
              '  ttqsS3RestoreS2Topology_();',
              '  var restored = ttqsAssertS2TriggerContract_();',
              "  ttqsS3RecordTopology_('ROLLBACK_TO_S2', restored);",
              '  return restored;',
              '}',
          ]
          p.write_text(text + '\n'.join(lines) + '\n')

          replace_once(bootstrap,
              "function ttqsAssertManagedTriggerContract_() {\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {",
              "function ttqsAssertManagedTriggerContract_() {\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) {\n    if (typeof ttqsAssertS3TriggerContract_ !== 'function') throw new Error('S3_TRIGGER_CONTRACT_REQUIRED');\n    return ttqsAssertS3TriggerContract_();\n  }\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {")

          replace_once(bootstrap,
              "function ttqsInstallManagedTriggers_() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {",
              "function ttqsInstallManagedTriggers_() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_MANAGED_TRIGGER_REINSTALL_FORBIDDEN');\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {")

          replace_once(shadow,
              "    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {\n      throw new Error('S2_RUNTIME_MODE_ACTIVE');\n    }",
              "    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {\n      throw new Error('S2_RUNTIME_MODE_ACTIVE');\n    }\n    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_ACTIVE');")
          PY

          cat > tests/scheduler-s3-topology.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const source = fs.readFileSync('apps-script/SchedulerOrchestrator.gs', 'utf8');
          const bootstrap = fs.readFileSync('apps-script/Bootstrap.gs', 'utf8');
          const shadow = fs.readFileSync('apps-script/SchedulerShadow.gs', 'utf8');

          function body(text, name, next) {
            const re = next ? new RegExp(`function ${name}\\([^)]*\\) \\{([\\s\\S]*?)\\n\\}\\n\\nfunction ${next}`) : new RegExp(`function ${name}\\([^)]*\\) \\{([\\s\\S]*?)\\n\\}\\s*$`);
            const m = text.match(re); assert.ok(m, `${name} body must be isolatable`); return m[1];
          }

          test('S3 topology sources parse', () => { new vm.Script(source); new vm.Script(bootstrap); new vm.Script(shadow); });

          test('master scheduler accepts S2 and S3 but not legacy mode', () => {
            const b = body(source, 'ttqsSchedulerMasterModeActive_', 'ttqsS2TaskDefinitions_');
            const c = { TTQS_S2_MODE:'S2', TTQS_S3_MODE:'S3', mode:'LEGACY' }; c.ttqsSchedulerRuntimeMode_=()=>c.mode; vm.createContext(c); vm.runInContext(`function ttqsSchedulerMasterModeActive_(){${b}\n}`,c);
            c.mode='S2'; assert.equal(c.ttqsSchedulerMasterModeActive_(),true); c.mode='S3'; assert.equal(c.ttqsSchedulerMasterModeActive_(),true); c.mode='LEGACY'; assert.equal(c.ttqsSchedulerMasterModeActive_(),false);
            assert.match(source,/reason: 'MODE_NOT_MASTER'/); assert.match(body(source,'ttqsSchedulerMasterTrigger','ttqsS2MasterTriggers_'),/SCHEDULER_MASTER_RUNTIME_MODE_REQUIRED/);
          });

          test('S3 contract is exactly one master and no other project trigger', () => {
            const b=body(source,'ttqsAssertS3TriggerContract_','ttqsS3RecordTopology_');
            const c={TTQS_S2_MASTER_HANDLER:'ttqsSchedulerMasterTrigger',TTQS_S1_SHADOW_HANDLER:'ttqsSchedulerShadowTrigger',TTQS_S3_MODE:'S3_SINGLE_SCHEDULER',ttqsS2LegacyClockHandlers_:()=>({ttqsRetryFailedJobs:true,ttqsReconcile:true,ttqsRefreshConsultView:true})};
            c.ScriptApp={EventType:{CLOCK:'CLOCK'},TriggerSource:{CLOCK:'CLOCK'},triggers:[],getProjectTriggers(){return this.triggers;}};
            const mk=(h,e='CLOCK',s='CLOCK')=>({getHandlerFunction:()=>h,getEventType:()=>e,getTriggerSource:()=>s}); vm.createContext(c); vm.runInContext(`function ttqsAssertS3TriggerContract_(){${b}\n}`,c);
            c.ScriptApp.triggers=[mk('ttqsSchedulerMasterTrigger')]; const ok=JSON.parse(JSON.stringify(c.ttqsAssertS3TriggerContract_())); assert.equal(ok.master,1); assert.equal(ok.formSubmit,0);
            c.ScriptApp.triggers=[mk('ttqsSchedulerMasterTrigger'),mk('ttqsOnSpreadsheetFormSubmit','ON_FORM_SUBMIT','SPREADSHEETS')]; assert.throws(()=>c.ttqsAssertS3TriggerContract_(),/S3_UNEXPECTED_TRIGGER:ttqsOnSpreadsheetFormSubmit/);
            c.ScriptApp.triggers=[mk('ttqsSchedulerMasterTrigger'),mk('ttqsRetryFailedJobs')]; assert.throws(()=>c.ttqsAssertS3TriggerContract_(),/S3_FORBIDDEN_LEGACY_TRIGGER/);
            c.ScriptApp.triggers=[mk('ttqsSchedulerMasterTrigger'),mk('mysteryTrigger')]; assert.throws(()=>c.ttqsAssertS3TriggerContract_(),/S3_UNEXPECTED_TRIGGER:mysteryTrigger/);
          });

          test('S3 installer requires S2, preserves cadence state, removes submit, records topology and rolls back', () => {
            const i=body(source,'ttqsInstallS3SingleSchedulerTest','ttqsRollbackS3SingleSchedulerTest'); assert.match(i,/S3_S2_RUNTIME_BASELINE_REQUIRED/); assert.match(i,/ttqsAssertS2TriggerContract_/); assert.match(i,/ttqsS3RemoveFormSubmitTriggers_/); assert.match(i,/setProperty\(TTQS_S2_MODE_PROPERTY, TTQS_S3_MODE\)/); assert.match(i,/ttqsAssertS3TriggerContract_/); assert.match(i,/ttqsS3RecordTopology_\('CUTOVER'/); assert.match(i,/ttqsS3RestoreS2Topology_/); assert.doesNotMatch(i,/ttqsS2InitializeState_/);
            const r=body(source,'ttqsS3RestoreS2Topology_','ttqsInstallS3SingleSchedulerTest'); assert.match(r,/newTrigger\(TTQS_S2_MASTER_HANDLER\)/); assert.match(r,/newTrigger\('ttqsOnSpreadsheetFormSubmit'\).*onFormSubmit/s); assert.match(r,/setProperty\(TTQS_S2_MODE_PROPERTY, TTQS_S2_MODE\)/);
          });

          test('S3 topology writes bounded readback telemetry', () => { const r=body(source,'ttqsS3RecordTopology_','ttqsS3RestoreS2Topology_'); assert.match(r,/record_type: 'TOPOLOGY'/); assert.match(r,/task_name: '__TOPOLOGY__'/); assert.match(r,/master:/); assert.match(r,/form_submit:/); assert.match(r,/ttqsS2Bounded_/); });

          test('S2 public cutover and rollback cannot overwrite active S3', () => { const i=body(source,'ttqsInstallS2ClockConsolidationTest','ttqsRollbackS2ClockConsolidationTest'); assert.match(i,/S3_RUNTIME_MODE_ACTIVE/); const r=source.match(/function ttqsRollbackS2ClockConsolidationTest\(\) \{([\s\S]*?)\n\}\n\nfunction ttqsS3FormSubmitTriggers_/); assert.ok(r); assert.match(r[1],/S3_RUNTIME_MODE_ACTIVE/); });

          test('Bootstrap and S1 installer cannot resurrect replaced triggers in S3', () => { assert.match(bootstrap,/ttqsAssertS3TriggerContract_/); assert.match(bootstrap,/S3_MANAGED_TRIGGER_REINSTALL_FORBIDDEN/); const i=shadow.match(/function ttqsInstallShadowSchedulerTest\(\) \{([\s\S]*?)\n\}\n\nfunction ttqsRemoveShadowSchedulerTest/); assert.ok(i); assert.match(i[1],/S3_RUNTIME_MODE_ACTIVE/); });
          EOF

      - name: Remove one-time builders before manifest
        shell: bash
        run: |
          git rm .github/workflows/s3-final-topology-build.yml .github/workflows/s3-final-topology-build-v2.yml
          git add apps-script/SchedulerOrchestrator.gs apps-script/Bootstrap.gs apps-script/SchedulerShadow.gs tests/scheduler-s3-topology.test.mjs

      - name: Regenerate exact manifest with NUL-safe paths
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          excluded={'release/MANIFEST.sha256','release/MANIFEST.sha256.sha256'}
          raw=subprocess.check_output(['git','ls-files','-z'])
          files=[x.decode('utf-8') for x in raw.split(b'\0') if x]
          lines=[]
          for path in sorted(files):
              if path in excluded: continue
              p=Path(path)
              if not p.is_file(): raise SystemExit(f'MANIFEST_TRACKED_FILE_MISSING:{path}')
              lines.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{path}')
          m=Path('release/MANIFEST.sha256'); m.write_text('\n'.join(lines)+'\n')
          d=hashlib.sha256(m.read_bytes()).hexdigest(); Path('release/MANIFEST.sha256.sha256').write_text(f'{d}  release/MANIFEST.sha256\n')
          PY
          git add release/MANIFEST.sha256 release/MANIFEST.sha256.sha256

      - name: Verify repository
        run: |
          npm ci
          npm run verify

      - name: Commit verified final topology patch
        shell: bash
        run: |
          git config user.name 'ttqs-one-bot'
          git config user.email 'actions@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'P0: S3 收斂為真正單一 Scheduler topology'
          git push origin HEAD:s3/final-single-scheduler-topology
