name: S3 final topology builder

on:
  push:
    branches:
      - s3/final-single-scheduler-topology
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: s3/final-single-scheduler-topology

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply deterministic S3 topology patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_ANCHOR_COUNT_INVALID:{path}:{count}:{old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          scheduler = 'apps-script/SchedulerOrchestrator.gs'
          bootstrap = 'apps-script/Bootstrap.gs'
          shadow = 'apps-script/SchedulerShadow.gs'

          replace_once(
              scheduler,
              "var TTQS_S2_MODE = 'S2_CLOCK_CONSOLIDATED';\n",
              "var TTQS_S2_MODE = 'S2_CLOCK_CONSOLIDATED';\nvar TTQS_S3_MODE = 'S3_SINGLE_SCHEDULER';\n"
          )

          replace_once(
              scheduler,
              "function ttqsSchedulerRuntimeMode_() {\n  return String(PropertiesService.getScriptProperties().getProperty(TTQS_S2_MODE_PROPERTY) || 'LEGACY_S1');\n}\n\nfunction ttqsS2TaskDefinitions_() {",
              "function ttqsSchedulerRuntimeMode_() {\n  return String(PropertiesService.getScriptProperties().getProperty(TTQS_S2_MODE_PROPERTY) || 'LEGACY_S1');\n}\n\nfunction ttqsSchedulerMasterModeActive_() {\n  var mode = ttqsSchedulerRuntimeMode_();\n  return mode === TTQS_S2_MODE || mode === TTQS_S3_MODE;\n}\n\nfunction ttqsS2TaskDefinitions_() {"
          )

          replace_once(
              scheduler,
              "    if (ttqsSchedulerRuntimeMode_() !== TTQS_S2_MODE) return { claimed: false, task: definition.name, reason: 'MODE_NOT_S2' };",
              "    if (!ttqsSchedulerMasterModeActive_()) return { claimed: false, task: definition.name, reason: 'MODE_NOT_MASTER' };"
          )

          replace_once(
              scheduler,
              "function ttqsSchedulerMasterTrigger() {\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() !== TTQS_S2_MODE) throw new Error('S2_RUNTIME_MODE_REQUIRED');\n  var tickId = ttqsStableId_('S2TICK-', Utilities.getUuid(), 24);",
              "function ttqsSchedulerMasterTrigger() {\n  ttqsAssertTestOnly_();\n  var runtimeMode = ttqsSchedulerRuntimeMode_();\n  if (!ttqsSchedulerMasterModeActive_()) throw new Error('SCHEDULER_MASTER_RUNTIME_MODE_REQUIRED:' + runtimeMode);\n  var tickId = ttqsStableId_('S2TICK-', Utilities.getUuid(), 24);"
          )

          replace_once(
              scheduler,
              "  return { mode: TTQS_S2_MODE, tick_id: tickId, outcomes: outcomes };\n}",
              "  return { mode: runtimeMode, tick_id: tickId, outcomes: outcomes };\n}"
          )

          replace_once(
              scheduler,
              "function ttqsInstallS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();",
              "function ttqsInstallS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_ACTIVE');\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();"
          )

          replace_once(
              scheduler,
              "function ttqsRollbackS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  ttqsS2RestoreLegacyS1_('LEGACY_S1');",
              "function ttqsRollbackS2ClockConsolidationTest() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  ttqsAssertTestOnly_();\n  if (ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_ACTIVE');\n  ttqsS2RestoreLegacyS1_('LEGACY_S1');"
          )

          p = Path(scheduler)
          text = p.read_text().rstrip()
          if 'function ttqsInstallS3SingleSchedulerTest()' in text:
              raise SystemExit('S3_FUNCTIONS_ALREADY_PRESENT')
          append_lines = [
              '',
              '',
              'function ttqsS3FormSubmitTriggers_() {',
              '  return ScriptApp.getProjectTriggers().filter(function(trigger) {',
              "    return trigger.getHandlerFunction() === 'ttqsOnSpreadsheetFormSubmit';",
              '  });',
              '}',
              '',
              'function ttqsS3RemoveFormSubmitTriggers_() {',
              '  ttqsS3FormSubmitTriggers_().forEach(function(trigger) {',
              '    ScriptApp.deleteTrigger(trigger);',
              '  });',
              '}',
              '',
              'function ttqsAssertS3TriggerContract_() {',
              '  var counts = {};',
              '  var forbidden = ttqsS2LegacyClockHandlers_();',
              '  forbidden[TTQS_S1_SHADOW_HANDLER] = true;',
              '  var masterCount = 0;',
              '  var submitCount = 0;',
              '  ScriptApp.getProjectTriggers().forEach(function(trigger) {',
              '    var handler = trigger.getHandlerFunction();',
              '    counts[handler] = Number(counts[handler] || 0) + 1;',
              "    if (forbidden[handler]) throw new Error('S3_FORBIDDEN_LEGACY_TRIGGER:' + handler);",
              '    if (handler === TTQS_S2_MASTER_HANDLER) {',
              '      masterCount++;',
              '      if (trigger.getEventType() !== ScriptApp.EventType.CLOCK || trigger.getTriggerSource() !== ScriptApp.TriggerSource.CLOCK) {',
              "        throw new Error('S3_MASTER_TRIGGER_CONTRACT_INVALID');",
              '      }',
              '    }',
              "    if (handler === 'ttqsOnSpreadsheetFormSubmit') submitCount++;",
              '  });',
              "  if (masterCount !== 1) throw new Error('S3_MASTER_TRIGGER_COUNT_INVALID:' + masterCount);",
              "  if (submitCount !== 0) throw new Error('S3_FORM_SUBMIT_TRIGGER_COUNT_INVALID:' + submitCount);",
              '  return { counts: counts, mode: TTQS_S3_MODE, master: masterCount, formSubmit: submitCount };',
              '}',
              '',
              'function ttqsS3RestoreS2Topology_() {',
              '  return ttqsWithScriptLock_(function() {',
              '    ttqsAssertTestOnly_();',
              '    ttqsRemoveS2MasterTrigger_();',
              '    ScriptApp.newTrigger(TTQS_S2_MASTER_HANDLER).timeBased().everyMinutes(TTQS_S2_MASTER_INTERVAL_MINUTES).create();',
              '    ttqsS2RemoveLegacyClockTriggers_();',
              '    ttqsRemoveShadowSchedulerTrigger_();',
              '    ttqsS3RemoveFormSubmitTriggers_();',
              "    ScriptApp.newTrigger('ttqsOnSpreadsheetFormSubmit').forSpreadsheet(ttqsOpenCore_()).onFormSubmit().create();",
              '    PropertiesService.getScriptProperties().setProperty(TTQS_S2_MODE_PROPERTY, TTQS_S2_MODE);',
              '    ttqsEnsureS2LogSheet_();',
              '    return true;',
              '  });',
              '}',
              '',
              'function ttqsInstallS3SingleSchedulerTest() {',
              '  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);',
              '  ttqsAssertTestOnly_();',
              '  var mode = ttqsSchedulerRuntimeMode_();',
              '  if (mode === TTQS_S3_MODE) return ttqsAssertS3TriggerContract_();',
              "  if (mode !== TTQS_S2_MODE) throw new Error('S3_S2_RUNTIME_BASELINE_REQUIRED:' + mode);",
              '  var before = ttqsAssertS2TriggerContract_();',
              '  try {',
              '    ttqsWithScriptLock_(function() {',
              '      ttqsS3RemoveFormSubmitTriggers_();',
              '      PropertiesService.getScriptProperties().setProperty(TTQS_S2_MODE_PROPERTY, TTQS_S3_MODE);',
              '    });',
              '    var after = ttqsAssertS3TriggerContract_();',
              '    return {',
              '      mode: TTQS_S3_MODE,',
              "      environment: 'TEST',",
              '      before: before,',
              '      after: after,',
              '      state_revision: ttqsS2LoadState_().revision,',
              '      form_submit_removed: true,',
              '      rollback_mode: TTQS_S2_MODE',
              '    };',
              '  } catch (err) {',
              '    try {',
              '      ttqsS3RestoreS2Topology_();',
              '      ttqsAssertS2TriggerContract_();',
              '    } catch (rollbackErr) {',
              "      throw new Error('S3_INSTALL_FAIL:' + ttqsS2Bounded_(err && err.message ? err.message : err, 400) + '|ROLLBACK_FAIL:' + ttqsS2Bounded_(rollbackErr && rollbackErr.message ? rollbackErr.message : rollbackErr, 400));",
              '    }',
              '    throw err;',
              '  }',
              '}',
              '',
              'function ttqsRollbackS3SingleSchedulerTest() {',
              '  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);',
              '  ttqsAssertTestOnly_();',
              '  var mode = ttqsSchedulerRuntimeMode_();',
              '  if (mode === TTQS_S2_MODE) return ttqsAssertS2TriggerContract_();',
              "  if (mode !== TTQS_S3_MODE) throw new Error('S3_RUNTIME_MODE_REQUIRED_FOR_ROLLBACK:' + mode);",
              '  ttqsS3RestoreS2Topology_();',
              '  return ttqsAssertS2TriggerContract_();',
              '}',
          ]
          p.write_text(text + '\n'.join(append_lines) + '\n')

          replace_once(
              bootstrap,
              "function ttqsAssertManagedTriggerContract_() {\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {",
              "function ttqsAssertManagedTriggerContract_() {\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) {\n    if (typeof ttqsAssertS3TriggerContract_ !== 'function') throw new Error('S3_TRIGGER_CONTRACT_REQUIRED');\n    return ttqsAssertS3TriggerContract_();\n  }\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {"
          )

          replace_once(
              bootstrap,
              "function ttqsInstallManagedTriggers_() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {",
              "function ttqsInstallManagedTriggers_() {\n  ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) {\n    throw new Error('S3_MANAGED_TRIGGER_REINSTALL_FORBIDDEN');\n  }\n  if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {"
          )

          replace_once(
              shadow,
              "    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {\n      throw new Error('S2_RUNTIME_MODE_ACTIVE');\n    }",
              "    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S2_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S2_MODE) {\n      throw new Error('S2_RUNTIME_MODE_ACTIVE');\n    }\n    if (typeof ttqsSchedulerRuntimeMode_ === 'function' && typeof TTQS_S3_MODE !== 'undefined' && ttqsSchedulerRuntimeMode_() === TTQS_S3_MODE) {\n      throw new Error('S3_RUNTIME_MODE_ACTIVE');\n    }"
          )
          PY

          cat > tests/scheduler-s3-topology.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const source = fs.readFileSync('apps-script/SchedulerOrchestrator.gs', 'utf8');
          const bootstrap = fs.readFileSync('apps-script/Bootstrap.gs', 'utf8');
          const shadow = fs.readFileSync('apps-script/SchedulerShadow.gs', 'utf8');

          function functionBody(text, name, nextName) {
            const pattern = nextName
              ? new RegExp(`function ${name}\\([^)]*\\) \\{([\\s\\S]*?)\\n\\}\\n\\nfunction ${nextName}`)
              : new RegExp(`function ${name}\\([^)]*\\) \\{([\\s\\S]*?)\\n\\}\\s*$`);
            const match = text.match(pattern);
            assert.ok(match, `${name} body must be isolatable`);
            return match[1];
          }

          test('S3 topology sources parse', () => {
            new vm.Script(source, { filename: 'SchedulerOrchestrator.gs' });
            new vm.Script(bootstrap, { filename: 'Bootstrap.gs' });
            new vm.Script(shadow, { filename: 'SchedulerShadow.gs' });
          });

          test('master scheduler stays active in both S2 and S3 runtime modes', () => {
            assert.match(source, /var TTQS_S3_MODE = 'S3_SINGLE_SCHEDULER'/);
            const body = functionBody(source, 'ttqsSchedulerMasterModeActive_', 'ttqsS2TaskDefinitions_');
            const context = { TTQS_S2_MODE: 'S2', TTQS_S3_MODE: 'S3', mode: 'LEGACY' };
            context.ttqsSchedulerRuntimeMode_ = () => context.mode;
            vm.createContext(context);
            vm.runInContext(`function ttqsSchedulerMasterModeActive_() {${body}\n}`, context);
            context.mode = 'S2';
            assert.equal(context.ttqsSchedulerMasterModeActive_(), true);
            context.mode = 'S3';
            assert.equal(context.ttqsSchedulerMasterModeActive_(), true);
            context.mode = 'LEGACY';
            assert.equal(context.ttqsSchedulerMasterModeActive_(), false);
            assert.match(functionBody(source, 'ttqsSchedulerMasterTrigger', 'ttqsS2MasterTriggers_'), /SCHEDULER_MASTER_RUNTIME_MODE_REQUIRED/);
            assert.match(source, /reason: 'MODE_NOT_MASTER'/);
          });

          test('S3 trigger contract executable topology is exactly one master and zero form-submit', () => {
            const body = functionBody(source, 'ttqsAssertS3TriggerContract_', 'ttqsS3RestoreS2Topology_');
            const context = {
              TTQS_S2_MASTER_HANDLER: 'ttqsSchedulerMasterTrigger',
              TTQS_S1_SHADOW_HANDLER: 'ttqsSchedulerShadowTrigger',
              TTQS_S3_MODE: 'S3_SINGLE_SCHEDULER',
              ttqsS2LegacyClockHandlers_: () => ({ ttqsRetryFailedJobs: true, ttqsReconcile: true, ttqsRefreshConsultView: true })
            };
            context.ScriptApp = {
              EventType: { CLOCK: 'CLOCK' },
              TriggerSource: { CLOCK: 'CLOCK' },
              triggers: [],
              getProjectTriggers() { return this.triggers; }
            };
            const mk = (handler, eventType = 'CLOCK', sourceType = 'CLOCK') => ({
              getHandlerFunction: () => handler,
              getEventType: () => eventType,
              getTriggerSource: () => sourceType
            });
            vm.createContext(context);
            vm.runInContext(`function ttqsAssertS3TriggerContract_() {${body}\n}`, context);

            context.ScriptApp.triggers = [mk('ttqsSchedulerMasterTrigger')];
            const valid = JSON.parse(JSON.stringify(context.ttqsAssertS3TriggerContract_()));
            assert.equal(valid.master, 1);
            assert.equal(valid.formSubmit, 0);
            assert.equal(valid.mode, 'S3_SINGLE_SCHEDULER');

            context.ScriptApp.triggers = [mk('ttqsSchedulerMasterTrigger'), mk('ttqsOnSpreadsheetFormSubmit', 'ON_FORM_SUBMIT', 'SPREADSHEETS')];
            assert.throws(() => context.ttqsAssertS3TriggerContract_(), /S3_FORM_SUBMIT_TRIGGER_COUNT_INVALID:1/);
            context.ScriptApp.triggers = [mk('ttqsSchedulerMasterTrigger'), mk('ttqsRetryFailedJobs')];
            assert.throws(() => context.ttqsAssertS3TriggerContract_(), /S3_FORBIDDEN_LEGACY_TRIGGER:ttqsRetryFailedJobs/);
            context.ScriptApp.triggers = [mk('ttqsSchedulerMasterTrigger'), mk('ttqsSchedulerShadowTrigger')];
            assert.throws(() => context.ttqsAssertS3TriggerContract_(), /S3_FORBIDDEN_LEGACY_TRIGGER:ttqsSchedulerShadowTrigger/);
          });

          test('S3 installer requires S2 baseline, preserves cadence state, and rolls back to S2', () => {
            const install = functionBody(source, 'ttqsInstallS3SingleSchedulerTest', 'ttqsRollbackS3SingleSchedulerTest');
            assert.match(install, /S3_S2_RUNTIME_BASELINE_REQUIRED/);
            assert.match(install, /ttqsAssertS2TriggerContract_\(\)/);
            assert.match(install, /ttqsS3RemoveFormSubmitTriggers_\(\)/);
            assert.match(install, /setProperty\(TTQS_S2_MODE_PROPERTY, TTQS_S3_MODE\)/);
            assert.match(install, /ttqsAssertS3TriggerContract_\(\)/);
            assert.match(install, /ttqsS3RestoreS2Topology_\(\)/);
            assert.match(install, /ROLLBACK_FAIL/);
            assert.doesNotMatch(install, /ttqsS2InitializeState_\(\)/);
          });

          test('S3 rollback restores S2 master plus spreadsheet form-submit', () => {
            const restore = functionBody(source, 'ttqsS3RestoreS2Topology_', 'ttqsInstallS3SingleSchedulerTest');
            assert.match(restore, /ttqsRemoveS2MasterTrigger_\(\)/);
            assert.match(restore, /newTrigger\(TTQS_S2_MASTER_HANDLER\).*everyMinutes\(TTQS_S2_MASTER_INTERVAL_MINUTES\)/s);
            assert.match(restore, /ttqsS2RemoveLegacyClockTriggers_\(\)/);
            assert.match(restore, /ttqsRemoveShadowSchedulerTrigger_\(\)/);
            assert.match(restore, /ttqsS3RemoveFormSubmitTriggers_\(\)/);
            assert.match(restore, /newTrigger\('ttqsOnSpreadsheetFormSubmit'\)\.forSpreadsheet\(ttqsOpenCore_\(\)\)\.onFormSubmit\(\)\.create\(\)/);
            assert.match(restore, /setProperty\(TTQS_S2_MODE_PROPERTY, TTQS_S2_MODE\)/);
          });

          test('legacy S2 public installer and rollback cannot overwrite active S3 topology', () => {
            const install = functionBody(source, 'ttqsInstallS2ClockConsolidationTest', 'ttqsRollbackS2ClockConsolidationTest');
            assert.match(install, /ttqsSchedulerRuntimeMode_\(\) === TTQS_S3_MODE/);
            assert.match(install, /S3_RUNTIME_MODE_ACTIVE/);
            const rollback = source.match(/function ttqsRollbackS2ClockConsolidationTest\(\) \{([\s\S]*?)\n\}\n\nfunction ttqsS3FormSubmitTriggers_/);
            assert.ok(rollback);
            assert.match(rollback[1], /ttqsSchedulerRuntimeMode_\(\) === TTQS_S3_MODE/);
            assert.match(rollback[1], /S3_RUNTIME_MODE_ACTIVE/);
          });

          test('Bootstrap cannot recreate form-submit or legacy clocks in S3', () => {
            assert.match(bootstrap, /TTQS_S3_MODE/);
            assert.match(bootstrap, /ttqsAssertS3TriggerContract_\(\)/);
            assert.match(bootstrap, /S3_MANAGED_TRIGGER_REINSTALL_FORBIDDEN/);
            assert.match(bootstrap, /S2_MANAGED_TRIGGER_REINSTALL_FORBIDDEN/);
          });

          test('S1 shadow installer fails closed in S3', () => {
            const install = shadow.match(/function ttqsInstallShadowSchedulerTest\(\) \{([\s\S]*?)\n\}\n\nfunction ttqsRemoveShadowSchedulerTest/);
            assert.ok(install);
            assert.match(install[1], /TTQS_S2_MODE/);
            assert.match(install[1], /S2_RUNTIME_MODE_ACTIVE/);
            assert.match(install[1], /TTQS_S3_MODE/);
            assert.match(install[1], /S3_RUNTIME_MODE_ACTIVE/);
          });
          EOF

      - name: Remove one-time builder before manifest generation
        shell: bash
        run: |
          git rm .github/workflows/s3-final-topology-build.yml
          git add apps-script/SchedulerOrchestrator.gs apps-script/Bootstrap.gs apps-script/SchedulerShadow.gs tests/scheduler-s3-topology.test.mjs

      - name: Regenerate exact manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {'release/MANIFEST.sha256', 'release/MANIFEST.sha256.sha256'}
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          lines = []
          for path in sorted(files):
              if path in excluded:
                  continue
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'MANIFEST_TRACKED_FILE_MISSING:{path}')
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}')
          manifest = Path('release/MANIFEST.sha256')
          manifest.write_text('\n'.join(lines) + '\n')
          self_digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          Path('release/MANIFEST.sha256.sha256').write_text(f'{self_digest}  release/MANIFEST.sha256\n')
          PY
          git add release/MANIFEST.sha256 release/MANIFEST.sha256.sha256

      - name: Verify repository
        run: |
          npm ci
          npm run verify

      - name: Commit verified final topology patch
        shell: bash
        run: |
          git config user.name 'ttqs-one-bot'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git diff --cached --check
          git commit -m 'P0: S3 收斂為真正單一 Scheduler topology'
          git push origin HEAD:s3/final-single-scheduler-topology
