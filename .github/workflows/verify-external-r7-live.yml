name: R7 External TEST Live Verification

on:
  workflow_run:
    workflows:
      - Deploy External TEST Evaluator Portal
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  EXTERNAL_WEBAPP_URL: https://script.google.com/macros/s/AKfycbznbXi-0XWNV68E-vGU9CiAE6ElXGIlDmy27EePXMdGpRaorURzKZq0dDgsNBaaZOLh/exec
  EXTERNAL_RECEIPT_ISSUE: '39'

jobs:
  exhaustive-r7-live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'deploy/test')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'deploy/test' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository contract before live probe
        run: npm run verify

      - name: Persist auditable R2 19-marker live homepage evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r7-live-evidence
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'cache-control: no-cache' \
            -H 'user-agent: TTQS-ONE-G02-V10-LIVE-PROBE/2.0' \
            -o .r7-live-evidence/HOME_MARKER_PAGE.html \
            "$EXTERNAL_WEBAPP_URL"
          node scripts/external-blackbox-classifier.mjs \
            --html .r7-live-evidence/HOME_MARKER_PAGE.html \
            --evidence-out .r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json \
            2>&1 | tee .r7-live-evidence/BLACKBOX_MARKER_OUTPUT.txt
          grep -Fq 'BLACKBOX_MARKERS_PASS contract=R2_G02_19_REQUIRED markers=19/19 safety=PASS mode=R7_DRAFT003' .r7-live-evidence/BLACKBOX_MARKER_OUTPUT.txt
          node --input-type=module -e "import fs from 'node:fs'; const p='.r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); const ids=Array.from({length:19},(_,i)=>'G02-M'+String(i+1).padStart(2,'0')); if(r.schema!=='TTQS_BLACKBOX_MARKER_EVIDENCE_V2') throw new Error('MARKER_EVIDENCE_SCHEMA_FAIL'); if(r.contractId!=='R2_G02_19_REQUIRED'||r.evidenceMode!=='R2_G02_19_REQUIRED') throw new Error('MARKER_EVIDENCE_CONTRACT_FAIL'); if(r.mode!=='R7_DRAFT003') throw new Error('MARKER_EVIDENCE_MODE_FAIL'); if(r.markerEvidence?.length!==19) throw new Error('MARKER_EVIDENCE_COUNT_FAIL'); if(JSON.stringify(r.markerEvidence.map(x=>x.markerId))!==JSON.stringify(ids)) throw new Error('MARKER_EVIDENCE_ID_FAIL'); if(!r.markerEvidence.every(x=>x.expected&&x.actual===x.expected&&x.result==='PASS'&&x.evidence?.matchType==='NORMALIZED_SUBSTRING'&&Number.isInteger(x.evidence.normalizedIndex)&&x.evidence.normalizedIndex>=0&&String(x.evidence.excerpt||'').includes(x.expected))) throw new Error('MARKER_EVIDENCE_DETAIL_FAIL'); for(const id of ['G02-M01','G02-M17','G02-M18','G02-M19']){const x=r.markerEvidence.find(v=>v.markerId===id); if(!x||x.result!=='PASS') throw new Error('MARKER_EVIDENCE_SAFETY_REQUIRED_FAIL:'+id);} if(r.safetyEvidence?.expected!=='ABSENT'||r.safetyEvidence?.actual!=='ABSENT'||r.safetyEvidence?.result!=='PASS') throw new Error('MARKER_EVIDENCE_FRIENDLY_ERROR_FAIL'); if(r.derivation?.markerPassCount!==19||r.derivation?.markerTotal!==19||r.derivation?.requiredContractPass!==true||r.derivation?.acceptedContractPass!==true||r.derivation?.safetyPass!==true||r.derivation?.totalPass!==true) throw new Error('MARKER_EVIDENCE_DERIVATION_FAIL'); console.log('G02_V10_R2_MARKER_EVIDENCE_PASS contract=R2_G02_19_REQUIRED markers=19/19 safety=PASS total=PASS');"
          rm -f .r7-live-evidence/HOME_MARKER_PAGE.html

      - name: Exhaustively probe 19 matrices, 129 FrozenArtifacts, fail-closed routes, legacy R3 and performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r7-live-evidence
          MAX_TRANSPORT_ATTEMPTS=3
          ATTEMPT=1
          while true; do
            ATTEMPT_OUTPUT=".r7-live-evidence/R7_LIVE_PROBE_OUTPUT.attempt-${ATTEMPT}.txt"
            set +e
            node scripts/external-official129-live-probe.mjs 2>&1 | tee "$ATTEMPT_OUTPUT"
            PROBE_STATUS=${PIPESTATUS[0]}
            set -e
            cp "$ATTEMPT_OUTPUT" .r7-live-evidence/R7_LIVE_PROBE_OUTPUT.txt
            node --input-type=module -e "import fs from 'node:fs'; const input=process.argv[1],output=process.argv[2]; const s=fs.readFileSync(input,'utf8'); const m=s.match(/\\nOFFICIAL129_LIVE_BLACKBOX_(?:PASS|FAIL) [^\\n]*\\n?$/); if(!m) throw new Error('R7_LIVE_EVIDENCE_TRAILER_MISSING'); const raw=s.slice(0,m.index).trim(); const parsed=JSON.parse(raw); fs.writeFileSync(output,JSON.stringify(parsed)+'\\n');" "$ATTEMPT_OUTPUT" .r7-live-evidence/R7_LIVE_PROBE_EVIDENCE.json
            if test "$PROBE_STATUS" -eq 0; then
              printf '%s\n' "$ATTEMPT" > .r7-live-evidence/R7_LIVE_TRANSPORT_ATTEMPT.txt
              break
            fi
            if grep -Fq 'OFFICIAL129_LIVE_BLACKBOX_FAIL fetch failed' "$ATTEMPT_OUTPUT" && test "$ATTEMPT" -lt "$MAX_TRANSPORT_ATTEMPTS"; then
              echo "R7_LIVE_TRANSPORT_RETRY attempt=${ATTEMPT}/${MAX_TRANSPORT_ATTEMPTS} reason=fetch_failed"
              ATTEMPT=$((ATTEMPT + 1))
              sleep $((ATTEMPT * 2))
              continue
            fi
            printf '%s\n' "$ATTEMPT" > .r7-live-evidence/R7_LIVE_TRANSPORT_ATTEMPT.txt
            exit "$PROBE_STATUS"
          done
          grep -Fq 'OFFICIAL129_LIVE_BLACKBOX_PASS items=129 matrices=19 negatives=2 release=ER-DEMO-20260901-DRAFT-003' .r7-live-evidence/R7_LIVE_PROBE_OUTPUT.txt

      - name: Preserve live probe evidence as secondary human-download copy
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-external-test-live-evidence-${{ github.run_id }}
          path: .r7-live-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Publish durable Issue 39 evidence receipts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          RESULT="$(printf '%s' "$JOB_STATUS" | tr '[:lower:]' '[:upper:]')"
          PASS_LINE='NOT_AVAILABLE'
          MARKER_SUMMARY='NOT_AVAILABLE'
          MARKER_JSON_SHA256='NOT_AVAILABLE'
          LIVE_JSON_SHA256='NOT_AVAILABLE'
          TRANSPORT_ATTEMPT='NOT_AVAILABLE'
          if test -f .r7-live-evidence/R7_LIVE_PROBE_OUTPUT.txt; then
            PASS_LINE="$(grep -F 'OFFICIAL129_LIVE_BLACKBOX_PASS' .r7-live-evidence/R7_LIVE_PROBE_OUTPUT.txt | tail -n 1 || true)"
            test -n "$PASS_LINE" || PASS_LINE='NOT_AVAILABLE'
          fi
          if test -f .r7-live-evidence/BLACKBOX_MARKER_OUTPUT.txt; then
            MARKER_SUMMARY="$(grep -F 'BLACKBOX_MARKERS_PASS contract=R2_G02_19_REQUIRED' .r7-live-evidence/BLACKBOX_MARKER_OUTPUT.txt | tail -n 1 || true)"
            test -n "$MARKER_SUMMARY" || MARKER_SUMMARY='NOT_AVAILABLE'
          fi
          if test -f .r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json; then
            MARKER_JSON_SHA256="$(sha256sum .r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json | awk '{print $1}')"
          fi
          if test -f .r7-live-evidence/R7_LIVE_PROBE_EVIDENCE.json; then
            LIVE_JSON_SHA256="$(sha256sum .r7-live-evidence/R7_LIVE_PROBE_EVIDENCE.json | awk '{print $1}')"
          fi
          if test -f .r7-live-evidence/R7_LIVE_TRANSPORT_ATTEMPT.txt; then
            TRANSPORT_ATTEMPT="$(cat .r7-live-evidence/R7_LIVE_TRANSPORT_ATTEMPT.txt)"
          fi
          {
            echo '<!-- TTQS_R2_G02_MARKER_EVIDENCE_V1 -->'
            echo '## G-02／V-10｜R2 逐 marker 永久證據'
            echo
            echo '- acceptance_contract: `R2_G02_19_REQUIRED`'
            echo "- result: \`$RESULT\`"
            echo "- workflow_run_id: \`$GITHUB_RUN_ID\`"
            echo "- source_sha: \`$SOURCE_SHA\`"
            echo '- release: `ER-DEMO-20260901-DRAFT-003`'
            echo "- marker_evidence_sha256: \`sha256:$MARKER_JSON_SHA256\`"
            echo '- durable_byte_location: `this Issue #39 comment; fenced JSON below is the exact marker evidence payload`'
            echo '- scope: `TEST/SAMPLE/CONTROL only; REAL/PROD/formal scoring/official submission = 0`'
            echo
            echo '### Required marker evidence'
            if test -f .r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json; then
              echo '```json'
              cat .r7-live-evidence/BLACKBOX_MARKER_EVIDENCE.json
              echo '```'
            else
              echo '`BLACKBOX_MARKER_EVIDENCE.json NOT_AVAILABLE`'
            fi
            echo
            echo '### Derived summaries（不得取代上方逐 marker 明細）'
            echo "- marker_summary: \`$MARKER_SUMMARY\`"
            echo "- exhaustive_summary: \`$PASS_LINE\`"
            echo "- live_evidence_sha256: \`sha256:$LIVE_JSON_SHA256\`"
            echo "- transport_attempt: \`$TRANSPORT_ATTEMPT\`"
            echo "- artifact_secondary_copy: \`r7-external-test-live-evidence-$GITHUB_RUN_ID\`"
            echo "- artifact_id: \`${ARTIFACT_ID:-NOT_AVAILABLE}\`"
            echo "- artifact_digest: \`${ARTIFACT_DIGEST:-NOT_AVAILABLE}\`"
          } > .r7-live-receipt.md
          gh issue comment "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file .r7-live-receipt.md

          if test -f .r7-live-evidence/R7_LIVE_PROBE_EVIDENCE.json; then
            {
              echo '<!-- TTQS_R7_LIVE_EVIDENCE_V1 -->'
              echo '## R7 DRAFT-003｜全量 live 機器證據'
              echo
              echo "- result: \`$RESULT\`"
              echo "- workflow_run_id: \`$GITHUB_RUN_ID\`"
              echo "- source_sha: \`$SOURCE_SHA\`"
              echo '- release: `ER-DEMO-20260901-DRAFT-003`'
              echo "- live_evidence_sha256: \`sha256:$LIVE_JSON_SHA256\`"
              echo "- transport_attempt: \`$TRANSPORT_ATTEMPT\`"
              echo '- durable_byte_location: `this Issue #39 comment; fenced JSON below is the exact compact live evidence payload`'
              echo '- scope: `TEST/SAMPLE/CONTROL only; REAL/PROD/formal scoring/official submission = 0`'
              echo
              echo '```json'
              cat .r7-live-evidence/R7_LIVE_PROBE_EVIDENCE.json
              echo '```'
            } > .r7-live-evidence-receipt.md
            gh issue comment "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file .r7-live-evidence-receipt.md
          fi
