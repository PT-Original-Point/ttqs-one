name: R7 Premerge Machine Receipt

on:
  push:
    branches:
      - r7/official129-evaluator-integration-20260821

permissions:
  contents: write

concurrency:
  group: r7-branch-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify exact materialized source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-manifest.mjs
          npm run verify 2>&1 | tee /tmp/r7-verify.txt
          node scripts/build-external-official129.mjs 2>&1 | tee /tmp/r7-build.txt
          cmp -s external-viewer/Code.gs .external-viewer-build/Code.gs
          grep -Fq '# fail 0' /tmp/r7-verify.txt
          grep -Fq 'R7_EXTERNAL_BUILD_PASS items=129' /tmp/r7-build.txt
      - name: Create durable deterministic R7 premerge receipt
        shell: bash
        run: |
          set -euo pipefail
          tests="$(awk '/# tests /{v=$3} END{print v}' /tmp/r7-verify.txt)"
          pass="$(awk '/# pass /{v=$3} END{print v}' /tmp/r7-verify.txt)"
          fail="$(awk '/# fail /{v=$3} END{print v}' /tmp/r7-verify.txt)"
          build_sha="$(sed -n 's/.*buildCodeSha256=\([0-9a-f]\{64\}\).*/\1/p' /tmp/r7-build.txt | tail -1)"
          build_bytes="$(sed -n 's/.*buildBytes=\([0-9][0-9]*\).*/\1/p' /tmp/r7-build.txt | tail -1)"
          test -n "$tests" && test "$tests" = "$pass" && test "$fail" = "0"
          test -n "$build_sha" && test -n "$build_bytes"
          cat > release/official129/R7_PREMERGE_MACHINE_RECEIPT.txt <<EOF
          project_id=TTQS_ONE
          phase=T_TEST_RELEASE
          release_id=ER-DEMO-20260901-DRAFT-002
          scope=TEST/SAMPLE/CONTROL_ONLY
          real_write=0
          prod_enable=0
          formal_scoring=0
          official_submission=0
          indicator_count=19
          evaluation_row_count=26
          official_reference_example_count=129
          projection_sha256=7567530e1f72ef5c8ec491aa38936bf7884ef258943df5f01e0fce08c0c3f2de
          offline_pack_sha256=5026066430bd65c57f4c2adb59cef6e4bad70a6fcda298f89d864938dba0c676
          offline_manifest_sha256=2673e9abd5942eb3b3c27a5a54e05b1f73339a902035787344b65d2027e052ee
          tests=$tests
          pass=$pass
          fail=$fail
          materialized_source_cmp=PASS
          build_code_sha256=$build_sha
          build_bytes=$build_bytes
          runtime_live_drive_sheets_query=0
          invalid_routes_fail_closed=PASS
          legacy_fa_demo_002_preserved=PASS
          result=PREMERGE_MACHINE_PASS
          EOF
          sed -i 's/^          //' release/official129/R7_PREMERGE_MACHINE_RECEIPT.txt
      - name: Remove this one-off workflow and rebuild exact final manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r7-premerge-receipt.yml
          node scripts/generate-manifest.mjs
          npm run verify 2>&1 | tee /tmp/r7-final-verify.txt
          grep -Fq '# fail 0' /tmp/r7-final-verify.txt
          node scripts/build-external-official129.mjs >/tmp/r7-final-build.txt 2>&1
          cmp -s external-viewer/Code.gs .external-viewer-build/Code.gs
      - name: Publish receipt on clean final feature head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R7: record deterministic premerge machine receipt'
          git push origin "HEAD:${GITHUB_REF_NAME}"
