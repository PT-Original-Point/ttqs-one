name: R7 Cleanup Diagnostics

on:
  push:
    branches:
      - r7/official129-evaluator-integration-20260821

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary diagnostic harness and publish clean head
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r7-diagnostic.yml .github/workflows/r7-diagnostic-v2.yml .github/workflows/r7-cleanup-diagnostics.yml
          rm -f release/official129/R7_DIAGNOSTIC.txt release/official129/R7_DIAG_PASS_ALL release/official129/R7_DIAG_FAIL_*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R7: remove temporary diagnostic harness'
          git push origin "HEAD:${GITHUB_REF_NAME}"
