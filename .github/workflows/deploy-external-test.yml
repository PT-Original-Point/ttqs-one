name: Deploy External TEST Evaluator Portal

on:
  push:
    branches:
      - deploy/test

concurrency:
  group: ttqs-one-deploy-external-test
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  EXTERNAL_RECEIPT_ISSUE: '39'
  EXTERNAL_SCRIPT_TITLE: 'TTQS ONE TEST External Evaluator Portal'

jobs:
  deploy_external:
    if: github.ref == 'refs/heads/deploy/test'
    runs-on: ubuntu-24.04
    environment: TEST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Verify deploy ref and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/deploy/test"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'External TEST deploy source SHA: %s\n' "$GITHUB_SHA"

      - name: Mark external deployment receipt RUNNING
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state RUNNING
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Verify repository and external viewer safety contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run verify
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('external-viewer/appsscript.json', 'utf8'));
          const expectedScope = 'https://www.googleapis.com/auth/spreadsheets.readonly';
          const expectedService = [{ userSymbol: 'Sheets', version: 'v4', serviceId: 'sheets' }];
          if (manifest.webapp?.access !== 'ANYONE_ANONYMOUS') throw new Error('EXTERNAL_ACCESS_NOT_ANONYMOUS');
          if (manifest.webapp?.executeAs !== 'USER_DEPLOYING') throw new Error('EXTERNAL_EXECUTION_IDENTITY_INVALID');
          if (JSON.stringify(manifest.oauthScopes) !== JSON.stringify([expectedScope])) throw new Error('EXTERNAL_SCOPE_INVALID');
          if (JSON.stringify(manifest.dependencies?.enabledAdvancedServices) !== JSON.stringify(expectedService)) throw new Error('EXTERNAL_SHEETS_SERVICE_INVALID');
          const files = fs.readdirSync('external-viewer').sort();
          if (JSON.stringify(files) !== JSON.stringify(['Code.gs', 'appsscript.json'])) throw new Error('EXTERNAL_PUSH_SET_INVALID');
          NODE

      - name: Restore TEST clasp credentials
        shell: bash
        env:
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON_B64"
          printf '%s' "$CLASPRC_JSON_B64" | base64 -d > "$HOME/.clasprc.json"

      - name: Read durable external deployment receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node - <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('external-receipt-body.md', 'utf8');
          const marker = '<!-- TTQS_EXTERNAL_TEST_RECEIPT_V1 -->';
          if (!body.includes(marker)) throw new Error('EXTERNAL_RECEIPT_MARKER_MISSING');
          const match = body.match(/<!-- TTQS_EXTERNAL_TEST_RECEIPT_V1 -->[\s\S]*?```json\s*([\s\S]*?)```/);
          if (!match) throw new Error('EXTERNAL_RECEIPT_JSON_MISSING');
          const receipt = JSON.parse(match[1]);
          if (receipt.schema !== 'TTQS_EXTERNAL_TEST_RECEIPT_V1') throw new Error('EXTERNAL_RECEIPT_SCHEMA_INVALID');
          if (receipt.environment !== 'TEST' || receipt.rootDir !== 'external-viewer') throw new Error('EXTERNAL_RECEIPT_CONTEXT_INVALID');
          const scriptId = String(receipt.scriptId || '');
          const deploymentId = String(receipt.deploymentId || '');
          if (scriptId && !/^[A-Za-z0-9_-]{20,}$/.test(scriptId)) throw new Error('EXTERNAL_RECEIPT_SCRIPT_ID_INVALID');
          if (deploymentId && !/^AKfy[A-Za-z0-9_-]+$/.test(deploymentId)) throw new Error('EXTERNAL_RECEIPT_DEPLOYMENT_ID_INVALID');
          if (deploymentId && !scriptId) throw new Error('EXTERNAL_RECEIPT_DEPLOYMENT_WITHOUT_SCRIPT');
          fs.appendFileSync(process.env.GITHUB_ENV, `EXTERNAL_SCRIPT_ID=${scriptId}\nEXTERNAL_DEPLOYMENT_ID=${deploymentId}\n`);
          NODE

      - name: Recover or bootstrap external TEST Apps Script project
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID="$EXTERNAL_SCRIPT_ID"
          DEPLOYMENT_ID="$EXTERNAL_DEPLOYMENT_ID"
          if test -z "$SCRIPT_ID"; then
            npx --yes @google/clasp@3.3.0 list-scripts | tee external-scripts.txt
            node - <<'NODE'
            const fs = require('fs');
            const title = process.env.EXTERNAL_SCRIPT_TITLE;
            const lines = fs.readFileSync('external-scripts.txt', 'utf8').split(/\r?\n/).map(v => v.trim()).filter(Boolean);
            const matches = [];
            for (const line of lines) {
              if (!line.startsWith(title)) continue;
              const tail = line.slice(title.length).trim();
              const match = tail.match(/^[–—-]\s*([A-Za-z0-9_-]{20,})/);
              if (match) matches.push(match[1]);
            }
            const unique = [...new Set(matches)];
            if (unique.length > 1) throw new Error('EXTERNAL_SCRIPT_TITLE_AMBIGUOUS');
            fs.writeFileSync('external-script-candidate.txt', unique[0] || '');
            NODE
            SCRIPT_ID=$(cat external-script-candidate.txt)
          fi
          if test -z "$SCRIPT_ID"; then
            rm -rf .external-bootstrap
            mkdir .external-bootstrap
            (
              cd .external-bootstrap
              npx --yes @google/clasp@3.3.0 create-script --type standalone --title "$EXTERNAL_SCRIPT_TITLE"
            )
            SCRIPT_ID=$(node -p "require('./.external-bootstrap/.clasp.json').scriptId")
            test -n "$SCRIPT_ID"
            echo 'EXTERNAL_MODE=BOOTSTRAP' >> "$GITHUB_ENV"
          else
            echo 'EXTERNAL_MODE=REUSE' >> "$GITHUB_ENV"
          fi
          if ! printf '%s' "$SCRIPT_ID" | grep -Eq '^[A-Za-z0-9_-]{20,}$'; then
            echo 'EXTERNAL_SCRIPT_ID_INVALID'
            exit 1
          fi
          node -e "const fs=require('fs'); const scriptId=process.argv[1]; fs.writeFileSync('.clasp.json', JSON.stringify({scriptId,rootDir:'external-viewer'},null,2)+'\\n')" "$SCRIPT_ID"
          echo "EXTERNAL_SCRIPT_ID_RESOLVED=$SCRIPT_ID" >> "$GITHUB_ENV"
          echo "EXTERNAL_DEPLOYMENT_ID_PREVIOUS=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          printf 'EXTERNAL_SCRIPT_ID=%s\n' "$SCRIPT_ID"
          printf 'EXTERNAL_PREVIOUS_DEPLOYMENT_ID=%s\n' "${DEPLOYMENT_ID:-NONE}"

      - name: Verify external push set before deploy
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./.clasp.json'); if(p.rootDir!=='external-viewer'||!p.scriptId) process.exit(1)"
          npx --yes @google/clasp@3.3.0 show-file-status --json > external-clasp-status-before.json
          cat external-clasp-status-before.json

      - name: Push external TEST viewer
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3.3.0 push --force

      - name: Create or update external TEST web app deployment
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTION="TTQS_ONE_TEST_EXTERNAL $GITHUB_SHA"
          DEPLOYMENT_ID="$EXTERNAL_DEPLOYMENT_ID_PREVIOUS"
          if test -n "$DEPLOYMENT_ID"; then
            npx --yes @google/clasp@3.3.0 create-deployment --deploymentId "$DEPLOYMENT_ID" --description "$DESCRIPTION" | tee external-deploy.txt
          else
            npx --yes @google/clasp@3.3.0 create-deployment --description "$DESCRIPTION" | tee external-deploy.txt
            DEPLOYMENT_ID=$(grep -Eo 'AKfy[A-Za-z0-9_-]+' external-deploy.txt | head -n 1 || true)
          fi
          if test -z "$DEPLOYMENT_ID"; then
            npx --yes @google/clasp@3.3.0 list-deployments "$EXTERNAL_SCRIPT_ID_RESOLVED" | tee external-deployments.txt
            DEPLOYMENT_ID=$(grep -Eo 'AKfy[A-Za-z0-9_-]+' external-deployments.txt | tail -n 1 || true)
          fi
          if ! printf '%s' "$DEPLOYMENT_ID" | grep -Eq '^AKfy[A-Za-z0-9_-]+$'; then
            echo 'EXTERNAL_DEPLOYMENT_ID_INVALID'
            exit 1
          fi
          echo "EXTERNAL_DEPLOYMENT_ID_RESOLVED=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          printf 'EXTERNAL_DEPLOYMENT_ID=%s\n' "$DEPLOYMENT_ID"

      - name: Anonymous product black-box probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$EXTERNAL_DEPLOYMENT_ID_RESOLVED/exec"
          PASS=0
          for attempt in 1 2 3 4 5 6; do
            rm -f external-page.html
            if curl --fail --silent --show-error --location --max-time 30 "$URL" -o external-page.html; then
              if grep -Fq 'TTQS ONE' external-page.html \
                && grep -Fq 'SAMPLE 評核因果鏈' external-page.html \
                && grep -Fq '查看佐證與來源' external-page.html \
                && grep -Fq 'EXTERNAL_READONLY' external-page.html \
                && grep -Fq '19 / 19' external-page.html \
                && ! grep -Fq '目前無法載入唯讀快照' external-page.html; then
                PASS=1
                break
              fi
            fi
            sleep 10
          done
          if test "$PASS" -ne 1; then
            echo 'EXTERNAL_PRODUCT_BLACKBOX_FAIL'
            if test -f external-page.html; then sed -n '1,80p' external-page.html; fi
            exit 1
          fi
          echo 'EXTERNAL_PRODUCT_BLACKBOX_PASS'
          echo "EXTERNAL_WEBAPP_URL=$URL" >> "$GITHUB_ENV"
          printf 'EXTERNAL_WEBAPP_URL=%s\n' "$URL"

      - name: Publish durable deployment receipt after black-box PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state PASS_PRODUCT_BLACKBOX
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Record deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## TTQS ONE External TEST deployment'
            echo
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Script ID: $EXTERNAL_SCRIPT_ID_RESOLVED"
            echo "- Deployment ID: $EXTERNAL_DEPLOYMENT_ID_RESOLVED"
            echo "- URL: $EXTERNAL_WEBAPP_URL"
            echo '- Access: ANYONE_ANONYMOUS'
            echo '- Execute as: USER_DEPLOYING'
            echo '- Data: TEST/SAMPLE deidentified snapshot only'
            echo '- Anonymous black-box: PASS'
            echo '- Receipt: GitHub Issue #39'
            echo '- REAL/PROD: not performed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish FAILED receipt for observability
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state FAILED
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md
