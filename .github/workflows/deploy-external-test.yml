name: Deploy External TEST Evaluator Portal

on:
  push:
    branches:
      - deploy/test
  workflow_dispatch:

concurrency:
  group: ttqs-one-deploy-external-test
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  EXTERNAL_RECEIPT_ISSUE: '39'
  EXTERNAL_SCRIPT_TITLE: 'TTQS ONE TEST External Evaluator Portal'

jobs:
  deploy_external:
    if: github.ref == 'refs/heads/deploy/test'
    runs-on: ubuntu-24.04
    environment: TEST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Verify deploy ref and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/deploy/test"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'External TEST control source SHA: %s\n' "$GITHUB_SHA"

      - name: Read durable receipt and select provider mutation mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md

          FULL_DEPLOY=1
          if test "$GITHUB_EVENT_NAME" = "push"; then
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && test "$BEFORE" != "0000000000000000000000000000000000000000"; then
              if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- external-viewer; then
                FULL_DEPLOY=0
              fi
            fi
          fi
          export EXTERNAL_FULL_DEPLOY="$FULL_DEPLOY"

          node --input-type=module -e "import fs from 'node:fs'; import {parseReceiptBody} from './scripts/external-deployment-receipt.mjs'; const r=parseReceiptBody(fs.readFileSync('external-receipt-body.md','utf8')); const s=String(r.scriptId||''); const d=String(r.deploymentId||''); const u=String(r.webappUrl||''); const src=String(r.sourceSha||''); const full=process.env.EXTERNAL_FULL_DEPLOY==='1'; if(s&&!/^[A-Za-z0-9_-]{20,}$/.test(s)) throw new Error('EXTERNAL_RECEIPT_SCRIPT_ID_INVALID'); if(d&&!/^AKfy[A-Za-z0-9_-]+$/.test(d)) throw new Error('EXTERNAL_RECEIPT_DEPLOYMENT_ID_INVALID'); if(d&&!s) throw new Error('EXTERNAL_RECEIPT_DEPLOYMENT_WITHOUT_SCRIPT'); if(u&&(!d||u!=='https://script.google.com/macros/s/'+d+'/exec')) throw new Error('EXTERNAL_RECEIPT_WEBAPP_URL_INVALID'); if(!full){ if(!/^[0-9a-f]{40}$/.test(src)) throw new Error('EXTERNAL_RECEIPT_SOURCE_SHA_INVALID'); if(!s||!d||!u) throw new Error('EXTERNAL_BLACKBOX_ONLY_IDENTITY_REQUIRED'); } const lines=['EXTERNAL_FULL_DEPLOY='+(full?'1':'0'),'EXTERNAL_SCRIPT_ID='+s,'EXTERNAL_SCRIPT_ID_RESOLVED='+s,'EXTERNAL_DEPLOYMENT_ID='+d,'EXTERNAL_DEPLOYMENT_ID_RESOLVED='+d,'EXTERNAL_WEBAPP_URL='+u]; if(!full) lines.push('EXTERNAL_RECEIPT_SOURCE_SHA='+src); fs.appendFileSync(process.env.GITHUB_ENV,lines.join('\\n')+'\\n');"

          if test "$FULL_DEPLOY" = "1"; then
            echo 'EXTERNAL_DEPLOY_MODE=FULL_PROVIDER_MUTATION'
          else
            echo 'EXTERNAL_DEPLOY_MODE=BLACKBOX_ONLY_NO_PROVIDER_MUTATION'
          fi

      - name: Mark external deployment receipt RUNNING
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state RUNNING
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Verify repository and external viewer safety contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run verify
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('external-viewer/appsscript.json','utf8')); const code=fs.readFileSync('external-viewer/Code.gs','utf8'); if(manifest.webapp?.access!=='ANYONE_ANONYMOUS') throw new Error('EXTERNAL_ACCESS_NOT_ANONYMOUS'); if(manifest.webapp?.executeAs!=='USER_DEPLOYING') throw new Error('EXTERNAL_EXECUTION_IDENTITY_INVALID'); if(Object.hasOwn(manifest,'oauthScopes')) throw new Error('EXTERNAL_RUNTIME_OAUTH_SCOPE_FORBIDDEN'); if(Object.hasOwn(manifest,'dependencies')) throw new Error('EXTERNAL_RUNTIME_ADVANCED_SERVICE_FORBIDDEN'); if(/Sheets\\.|SpreadsheetApp|DriveApp|UrlFetchApp/.test(code)) throw new Error('EXTERNAL_RUNTIME_GOOGLE_DATA_API_FORBIDDEN'); const files=fs.readdirSync('external-viewer').sort(); if(JSON.stringify(files)!==JSON.stringify(['Code.gs','appsscript.json'])) throw new Error('EXTERNAL_PUSH_SET_INVALID');"

      - name: Restore TEST OAuth credential material
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        env:
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON_B64"
          OAUTH_FILE="$RUNNER_TEMP/ttqs-external-oauth.json"
          printf '%s' "$CLASPRC_JSON_B64" | base64 -d > "$OAUTH_FILE"
          chmod 600 "$OAUTH_FILE"
          echo "EXTERNAL_OAUTH_FILE=$OAUTH_FILE" >> "$GITHUB_ENV"

      - name: Verify minimal OAuth deployment contract
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apps-script-rest-deploy.mjs auth-check --credentials "$EXTERNAL_OAUTH_FILE"

      - name: Recover or bootstrap external TEST Apps Script project via REST
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apps-script-rest-deploy.mjs ensure-project \
            --credentials "$EXTERNAL_OAUTH_FILE" \
            --script-id "$EXTERNAL_SCRIPT_ID" \
            --title "$EXTERNAL_SCRIPT_TITLE" \
            --env-file "$GITHUB_ENV"

      - name: Persist external script identity before content push
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state RUNNING
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Push external TEST viewer via Apps Script REST
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apps-script-rest-deploy.mjs push-content \
            --credentials "$EXTERNAL_OAUTH_FILE" \
            --script-id "$EXTERNAL_SCRIPT_ID_RESOLVED" \
            --root-dir external-viewer

      - name: Create or update external TEST web app deployment via REST
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTION="TTQS_ONE_TEST_EXTERNAL $GITHUB_SHA"
          node scripts/apps-script-rest-deploy.mjs deploy \
            --credentials "$EXTERNAL_OAUTH_FILE" \
            --script-id "$EXTERNAL_SCRIPT_ID_RESOLVED" \
            --deployment-id "$EXTERNAL_DEPLOYMENT_ID" \
            --description "$DESCRIPTION" \
            --env-file "$GITHUB_ENV"

      - name: Persist external deployment identity before black-box probe
        if: env.EXTERNAL_FULL_DEPLOY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state RUNNING
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Anonymous product black-box probe
        shell: bash
        run: |
          set -euo pipefail
          URL="$EXTERNAL_WEBAPP_URL"
          test -n "$URL"
          PASS=0
          LAST_STATUS="000"
          LAST_CLASSIFIER=""
          for attempt in 1 2 3 4 5 6; do
            rm -f external-page.html
            META="$(curl --silent --show-error --location --max-time 30 -o external-page.html -w '%{http_code}|%{url_effective}' "$URL" 2>/dev/null || true)"
            LAST_STATUS="${META%%|*}"
            if test "$LAST_STATUS" = "200"; then
              if LAST_CLASSIFIER="$(node scripts/external-blackbox-classifier.mjs --html external-page.html 2>&1)"; then
                echo "$LAST_CLASSIFIER"
                PASS=1
                break
              fi
            fi
            sleep 10
          done
          if test "$PASS" -ne 1; then
            echo "EXTERNAL_PRODUCT_BLACKBOX_FAIL status=$LAST_STATUS classifier=$LAST_CLASSIFIER"
            exit 1
          fi
          echo 'EXTERNAL_PRODUCT_BLACKBOX_PASS'

      - name: Anonymous FrozenArtifact FA-01 through FA-07 probe
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID='FA-DEMO-002'
          ARTIFACT_URL="${EXTERNAL_WEBAPP_URL}?artifact=${ARTIFACT_ID}"
          PASS=0
          LAST_STATUS='000'
          LAST_EFFECTIVE=''
          LAST_CLASSIFIER=''
          for attempt in 1 2 3 4 5 6; do
            rm -f external-artifact.html
            META="$(curl --silent --show-error --location --max-time 30 -o external-artifact.html -w '%{http_code}|%{url_effective}' "$ARTIFACT_URL" 2>/dev/null || true)"
            LAST_STATUS="${META%%|*}"
            LAST_EFFECTIVE="${META#*|}"
            if test "$LAST_STATUS" = '200'; then
              if LAST_CLASSIFIER="$(node scripts/external-frozenartifact-classifier.mjs --html external-artifact.html --requested-url "$ARTIFACT_URL" --artifact-id "$ARTIFACT_ID" --http-status "$LAST_STATUS" --effective-url "$LAST_EFFECTIVE" 2>&1)"; then
                echo "$LAST_CLASSIFIER"
                PASS=1
                break
              fi
            fi
            sleep 10
          done
          if test "$PASS" -ne 1; then
            echo "FROZEN_ARTIFACT_BLACKBOX_FAIL status=$LAST_STATUS effective=$LAST_EFFECTIVE classifier=$LAST_CLASSIFIER"
            exit 1
          fi
          echo 'FROZEN_ARTIFACT_BLACKBOX_PASS'

      - name: Publish durable deployment receipt after black-box PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state PASS_PRODUCT_BLACKBOX
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md

      - name: Record deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_SOURCE_SHA="${EXTERNAL_RECEIPT_SOURCE_SHA:-$GITHUB_SHA}"
          if test "$EXTERNAL_FULL_DEPLOY" = "1"; then MODE='FULL_PROVIDER_MUTATION'; else MODE='BLACKBOX_ONLY_NO_PROVIDER_MUTATION'; fi
          {
            echo '## TTQS ONE External TEST deployment / verification'
            echo
            echo "- Deployed source SHA: $DEPLOYED_SOURCE_SHA"
            echo "- Verification SHA: $GITHUB_SHA"
            echo "- Mode: $MODE"
            echo "- Script ID: $EXTERNAL_SCRIPT_ID_RESOLVED"
            echo "- Deployment ID: $EXTERNAL_DEPLOYMENT_ID_RESOLVED"
            echo "- URL: $EXTERNAL_WEBAPP_URL"
            echo '- Provider path when mutation is required: Apps Script REST API with minimal deployment OAuth contract'
            echo '- Access: ANYONE_ANONYMOUS'
            echo '- Execute as: USER_DEPLOYING'
            echo '- Data: TEST/SAMPLE deidentified static snapshot only'
            echo '- Runtime Google data permissions: none'
            echo '- Anonymous product black-box: PASS'
            echo '- FrozenArtifact FA-01..FA-07 black-box: PASS; FA-08 remains HUMAN'
            echo '- Receipt: GitHub Issue #39'
            echo '- REAL/PROD: not performed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish FAILED receipt for observability
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > external-receipt-body.md
          node scripts/external-deployment-receipt.mjs --input external-receipt-body.md --output external-receipt-next.md --state FAILED
          gh issue edit "$EXTERNAL_RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file external-receipt-next.md
